server:
  listen: "127.0.0.1:8080"
  request_timeout: 30s
  max_results: 100
  max_read_bytes: 2097152
  max_diff_bytes: 4194304
  max_batch_requests: 20
  max_call_depth: 10
jdtls:
  # Point this at the jdtls launcher installed on the server.
  command: "/Users/donnie/Downloads/jdtls/bin/jdtls"
  workspace_root: "/Users/donnie/Workspace"
codegraph:
  enabled: true
  command: "codegraph-mcp"
  args: ["--embedding-model", "granite-97m"]
  data_root: "/Users/donnie/Workspace/codegraph-data"
  startup_timeout: 2m
  call_timeout: 30s
  max_concurrent_per_repo: 4
  max_processes: 2
  reindex_on_start: true
  telemetry: false
repositories:
  easy-rent-contract:
    path: "/Users/donnie/IdeaProjects/easy-rent-contract"
  home-trusteeship-contract:
    path: "/Users/donnie/IdeaProjects/home-trusteeship-contract"
