server:
  listen: "127.0.0.1:8080"
  request_timeout: 30s
  max_results: 100
  max_read_bytes: 2097152
  max_diff_bytes: 4194304
jdtls:
  # Point this at the jdtls launcher installed on the server.
  command: "/home/ubuntu/jdtls/bin/jdtls"
  workspace_root: "/home/ubuntu/root"
repositories:
  easy-rent-contract:
    path: "/easy-rent-contract"
  home-trusteeship-contract:
    path: "home-trusteeship-contract"
